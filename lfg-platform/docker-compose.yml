version: "3.8"
services:
  postgres:
    image: postgres:16
    container_name: lfg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lfg_platform
    ports:
      - "5432:5432"
    volumes:
      - lfg_pg_data:/var/lib/postgresql/data

volumes:
  lfg_pg_data:
